<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hệ thống Bản đồ Trực tuyến</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</head>

<body>
  <!-- Khung hiển thị bản đồ Leaflet -->
  <div id="map" class="w-screen h-screen"></div>

  <!-- Bảng điều khiển nằm góc trên bên phải -->
  <div id="map-control" class="w-64 absolute top-4 right-4 z-[1000] bg-white p-3 rounded-lg shadow-md border text-xs">
    
    <!-- Dropdown chọn khu vực bản đồ động -->
    <div class="mb-3 pb-2 border-b border-gray-200">
      <label for="map-selector" class="block font-bold mb-1 text-gray-700 text-xs">🌐 Chọn khu vực bản đồ:</label>
      <select id="map-selector" class="w-full p-1.5 border border-gray-300 rounded text-xs bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer">
        <option value="">Đang tải danh sách bản đồ...</option>
      </select>
    </div>

    <!-- Bản đồ nền -->
    <div class="font-bold mb-1.5 text-gray-500">Bản đồ nền</div>
    <div id="basemap-container" class="flex flex-col gap-1"></div>

    <!-- Lớp phủ -->
    <div class="border-t border-gray-400 pt-1.5 mt-2">
      <div class="font-bold mb-1 text-gray-500">Lớp phủ</div>
      <div id="overlay-container" class="flex flex-col gap-1"></div>
    </div>

  </div>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
